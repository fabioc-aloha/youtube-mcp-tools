name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish without the leading v
        required: true
        type: string

jobs:
  publish:
    name: Publish npm package and MCP Registry manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release metadata
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./server.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./server.json').packages[0].version")" = "$RELEASE_VERSION"

      - name: Install and test the MCP server
        run: npm ci && npm test

      - name: Check npm package publication
        id: npm-package
        shell: bash
        run: |
          if npm view "youtube-mcp-tools@$RELEASE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package with trusted publishing
        if: ${{ steps.npm-package.outputs.published != 'true' }}
        run: npm publish --provenance

      - name: Install MCP Registry publisher
        shell: bash
        run: |
          publisher_version=1.8.1
          publisher_sha256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${publisher_version}/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          echo "${publisher_sha256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry manifest
        run: ./mcp-publisher publish
